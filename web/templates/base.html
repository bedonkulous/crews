<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Crews{% endblock %} — crewai-dev-teams</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="/" class="contrast">🤖 crewai-dev-teams</a></strong></li>
      </ul>
      <ul>
        <li><a href="/">Dashboard</a></li>
        <li><a href="/crews/new" role="button" class="outline">+ New Crew</a></li>
        <li><a href="/env">Env</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container">
    <small>crewai-dev-teams — local dev tool, bind to 127.0.0.1 only</small>
  </footer>
</body>
</html>
