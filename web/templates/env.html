{% extends "base.html" %}
{% block title %}Environment{% endblock %}

{% block content %}
<div x-data="envPage()" x-init="init()">

  <h2>Environment Variables</h2>
  <p><small>Stored in <code>.env</code> in the project root. Values are masked for display.</small></p>

  <div x-cloak x-show="error" class="alert alert-error"   x-text="error"></div>
  <div x-cloak x-show="saved" class="alert alert-success">Saved.</div>

  <div x-show="loading" aria-busy="true">Loading…</div>

  <div x-cloak x-show="!loading">
    <figure>
      <table>
        <thead>
          <tr><th>Key</th><th>Value</th><th>Required</th><th></th></tr>
        </thead>
        <tbody>
          <template x-for="(entry, idx) in vars" :key="entry.key">
            <tr>
              <td><code x-text="entry.key"></code></td>
              <td>
                <span x-show="editingKey !== entry.key">
                  <span class="env-value" x-text="entry.is_set ? entry.masked_value : '(not set)'"></span>
                  <button class="outline" style="margin-left:0.5rem;" @click="startEdit(entry)">Edit</button>
                </span>
                <span x-show="editingKey === entry.key" style="display:flex; gap:0.5rem; align-items:center;">
                  <input type="text" x-model="editValue"
                    style="margin:0; padding:0.25rem 0.5rem; font-size:0.875rem; font-family:monospace;"
                    @keydown.enter="saveEdit(entry.key)" @keydown.escape="cancelEdit()" />
                  <button @click="saveEdit(entry.key)" :disabled="saving">Save</button>
                  <button class="outline" @click="cancelEdit()">Cancel</button>
                </span>
              </td>
              <td>
                <span x-show="entry.is_required" class="badge badge-warn">required</span>
              </td>
              <td>
                <button class="outline contrast" @click="deleteVar(entry.key)" :disabled="deleting === entry.key">
                  <span x-show="deleting === entry.key" class="spinner"></span>
                  Delete
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </figure>

    <h4>Add / update variable</h4>
    <form @submit.prevent="addVar" style="display:flex; gap:0.75rem; align-items:flex-end; flex-wrap:wrap;">
      <label style="flex:1; min-width:160px; margin:0;">
        Key <input type="text" x-model="newKey" placeholder="MY_VAR" required style="margin:0;" />
      </label>
      <label style="flex:2; min-width:220px; margin:0;">
        Value <input type="text" x-model="newValue" placeholder="value" style="margin:0;" />
      </label>
      <button type="submit" :disabled="saving" style="align-self:flex-end;">
        <span x-show="saving" class="spinner"></span>
        Set
      </button>
    </form>
  </div>
</div>

<script>
function envPage() {
  return {
    vars: [], loading: true, error: null, saved: false, saving: false,
    deleting: null, editingKey: null, editValue: '', newKey: '', newValue: '',

    async init() { await this.loadVars(); },

    async loadVars() {
      this.loading = true;
      try {
        const r = await fetch('/api/env');
        if (!r.ok) throw new Error(await r.text());
        this.vars = await r.json();
      } catch (e) {
        this.error = 'Failed to load env: ' + e.message;
      } finally {
        this.loading = false;
      }
    },

    startEdit(entry) { this.editingKey = entry.key; this.editValue = ''; },
    cancelEdit()     { this.editingKey = null; this.editValue = ''; },

    async saveEdit(key) {
      this.saving = true; this.error = null;
      try {
        const r = await fetch('/api/env', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value: this.editValue }),
        });
        const data = await r.json();
        if (!r.ok) { this.error = data.error || 'Save failed.'; return; }
        const idx = this.vars.findIndex(v => v.key === key);
        if (idx !== -1) this.vars[idx] = data;
        this.cancelEdit(); this.flash();
      } catch (e) { this.error = e.message; }
      finally { this.saving = false; }
    },

    async addVar() {
      if (!this.newKey.trim()) return;
      this.saving = true; this.error = null;
      try {
        const r = await fetch('/api/env', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: this.newKey.trim(), value: this.newValue }),
        });
        const data = await r.json();
        if (!r.ok) { this.error = data.error || 'Failed.'; return; }
        const idx = this.vars.findIndex(v => v.key === data.key);
        if (idx !== -1) this.vars[idx] = data; else this.vars.push(data);
        this.newKey = ''; this.newValue = ''; this.flash();
      } catch (e) { this.error = e.message; }
      finally { this.saving = false; }
    },

    async deleteVar(key) {
      if (!confirm(`Delete "${key}"?`)) return;
      this.deleting = key;
      try {
        const r = await fetch('/api/env/' + encodeURIComponent(key), { method: 'DELETE' });
        if (r.ok || r.status === 204) this.vars = this.vars.filter(v => v.key !== key);
        else this.error = 'Delete failed.';
      } catch (e) { this.error = e.message; }
      finally { this.deleting = null; }
    },

    flash() { this.saved = true; setTimeout(() => { this.saved = false; }, 3000); },
  };
}
</script>
{% endblock %}
